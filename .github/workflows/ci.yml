name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    # A release tag only promotes an image main already checked (see release); it builds nothing.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install with CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[all,test]'
      # Some tests run helper scripts through `python3` on PATH; setup-python provides it.
      - run: python -m pytest -q

  image:
    # Builds and checks the CPU image on every pull request and push; never publishes.
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free runner disk for the image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the CPU image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          tags: ink-sdk:cpu
          load: true
          cache-from: type=gha,scope=ink-sdk-cpu
          cache-to: type=gha,scope=ink-sdk-cpu,mode=max,ignore-error=true
      - name: Smoke test inside the image
        run: |
          docker run --rm ink-sdk:cpu --help
          # The renderer, VILLA and its interpreter come from the image's environment.
          docker run --rm ink-sdk:cpu doctor --json > doctor.json
          python3 - <<'PY'
          import json
          checks = {c["name"]: c for c in json.load(open("doctor.json"))["checks"]}
          for name in ("renderer", "renderer-help", "villa", "villa-import", "model-python"):
              assert checks[name]["ok"], (name, checks[name])
          print("doctor: renderer, VILLA and the model interpreter are ready")
          PY
          docker run --rm --entrypoint python ink-sdk:cpu \
            -c "import ink_sdk, zarr; assert zarr.__version__.startswith('3')"
          docker run --rm --entrypoint /opt/villa/ink-detection/.venv/bin/python ink-sdk:cpu \
            -c "import koine_machines.inference.infer, zarr; assert zarr.__version__.startswith('2')"
          # Readers run as their own UID, which has no passwd entry in the image; importing
          # torch._dynamo (as torchvision does) must not need a username.
          docker run --rm --user 12345:12345 --entrypoint python ink-sdk:cpu -c "import torch._dynamo"
          docker run --rm --user 12345:12345 --entrypoint /opt/villa/ink-detection/.venv/bin/python \
            ink-sdk:cpu -c "import torch._dynamo, torchvision.ops"

  publish:
    # Rolling: every push to main publishes the image the image job just built and checked,
    # as edge-cpu and sha-<commit>-cpu. Version tags come only from the release job.
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free runner disk for the image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ink-sdk"
          {
            echo "tags<<EOF"
            echo "$image:edge-cpu"
            echo "$image:sha-${GITHUB_SHA::7}-cpu"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish ghcr.io/<owner>/ink-sdk from the checked build's cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=ink-sdk-cpu

  release:
    # Stable, CPU variant: pushing the git tag vX.Y.Z promotes the image main checked and
    # published for that exact commit to X.Y.Z-cpu and cpu. Nothing is rebuilt; a release is never
    # overwritten. The default (CUDA) image of the release comes from release-cuda.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the checked image of this commit
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the pyproject version $version"; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ink-sdk"
          source="$image:sha-${GITHUB_SHA::7}-cpu"
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}'; }
          if ! checked=$(digest "$source"); then
            echo "::error::$source is not published: tag a main commit whose image was checked"; exit 1
          fi
          if released=$(digest "$image:$version-cpu" 2>/dev/null) && [ "$released" != "$checked" ]; then
            echo "::error::$version-cpu is already published with other contents; releases are never overwritten"; exit 1
          fi
          docker buildx imagetools create --tag "$image:$version-cpu" --tag "$image:cpu" "$source"

  release-cuda:
    # Stable, default image: the CUDA build, published as X.Y.Z and latest. It is built and
    # checked on the GPU runner (real CUDA operations in both environments), only for releases.
    needs: release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: [self-hosted, linux, x64, nvidia]
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Refuse to overwrite a published release
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ink-sdk"
          if docker buildx imagetools inspect "$image:$version" > /dev/null 2>&1; then
            echo "::error::$image:$version is already published; releases are never overwritten"; exit 1
          fi
      - name: Build the CUDA image
        run: docker build --build-arg TORCH_BACKEND=cu128 -t ink-sdk:cuda .
      - name: The image's tools, and both PyTorch builds, without a GPU
        run: |
          docker run --rm ink-sdk:cuda doctor --json > doctor.json
          python3 - <<'PY'
          import json
          checks = {c["name"]: c for c in json.load(open("doctor.json"))["checks"]}
          for name in ("renderer", "renderer-help", "villa", "villa-import", "model-python"):
              assert checks[name]["ok"], (name, checks[name])
          PY
          for py in python /opt/villa/ink-detection/.venv/bin/python; do
            docker run --rm --user 12345:12345 --entrypoint "$py" ink-sdk:cuda \
              -c "import torch, torch._dynamo; assert torch.version.cuda, torch.__version__"
          done
      - name: Real GPU operations in both environments
        run: |
          for py in python /opt/villa/ink-detection/.venv/bin/python; do
            docker run --rm --gpus 'device=0' --user 12345:12345 --entrypoint "$py" ink-sdk:cuda -c "
          import torch
          assert torch.cuda.is_available(), 'CUDA is not available in the container'
          x = torch.ones(1, 1, 64, 64, device='cuda')
          y = torch.nn.functional.conv2d(x, torch.ones(1, 1, 3, 3, device='cuda'))
          assert float(y.max()) == 9.0
          print(torch.__version__, torch.cuda.get_device_name(0))"
          done
          docker run --rm --gpus 'device=0' ink-sdk:cuda doctor --json > doctor-gpu.json
          python3 -c 'import json; c = {x["name"]: x for x in json.load(open("doctor-gpu.json"))["checks"]}; assert c["cuda"]["ok"], c["cuda"]'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ghcr.io/<owner>/ink-sdk (default tags)
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ink-sdk"
          for tag in "$version" latest; do
            docker tag ink-sdk:cuda "$image:$tag"
            docker push "$image:$tag"
          done
